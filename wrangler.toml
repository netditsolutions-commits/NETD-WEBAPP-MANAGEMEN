name = "netd-webapp-api"
main = "worker.js"
compatibility_date = "2024-09-01"

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "netd_it_management"
database_id = "c60b36b7-af3a-4374-8e8f-1add3d96f9f8" # Replace with your Cloudflare D1 Database ID from: npx wrangler d1 create netd_it_management

# Workers Static Assets (Serves index.html, css, js directly on the worker domain)
[assets]
directory = "./"
binding = "ASSETS"
